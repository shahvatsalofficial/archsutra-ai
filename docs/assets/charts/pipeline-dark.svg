<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
<title id="t">ArchSutra pipeline</title><desc id="d">The repository is scanned read-only by the CLI, which produces evidence. The IDE model, guided by ArchSutra skills, verifies the evidence and writes the report.</desc>
<style>
:root{--bg:#121a33;--ink:#e6eaf5;--mute:#aab4cc;--line:#2c3a60;--a:#a5b4fc;--b:#5eead4;--c:#f0c36a;--bad:#ff9b92;--ok:#5fd39a}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.t{font-size:18px;font-weight:700}.s{font-size:12px}.l{font-size:13px}.n{font-size:13px;font-weight:700}
.axis{stroke:var(--line);stroke-width:1}.grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
</style>
<rect width="900" height="330" rx="14" fill="var(--bg)" stroke="var(--line)"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--mute)"/></marker></defs>
<text x="24" y="34" class="t">How ArchSutra turns your repository into a trustworthy report</text>
<text x="24" y="54" class="s m">The CLI measures (offline, read-only). Your IDE's own model reasons. The skills keep the model honest.</text><rect x="24" y="96" width="160" height="82" rx="12" fill="none" stroke="var(--mute)" stroke-width="2"/><text x="104" y="126" text-anchor="middle" class="l" style="font-weight:700">Your repository</text><text x="104" y="148" text-anchor="middle" class="s m">read-only, never executed</text><rect x="236" y="80" width="250" height="114" rx="12" fill="none" stroke="var(--a)" stroke-width="2"/><text x="361" y="110" text-anchor="middle" class="l" style="font-weight:700">archsutra CLI</text><text x="361" y="132" text-anchor="middle" class="s m">walk, map, 19 rules, redact</text><rect x="540" y="80" width="170" height="114" rx="12" fill="none" stroke="var(--b)" stroke-width="2"/><text x="625" y="110" text-anchor="middle" class="l" style="font-weight:700">Evidence</text><text x="625" y="132" text-anchor="middle" class="s m">findings.json, SARIF, maps</text><rect x="540" y="226" width="170" height="82" rx="12" fill="none" stroke="var(--c)" stroke-width="2"/><text x="625" y="256" text-anchor="middle" class="l" style="font-weight:700">Skills + Prime</text><text x="625" y="278" text-anchor="middle" class="s m">5 skills, 12 agents</text><rect x="236" y="226" width="250" height="82" rx="12" fill="none" stroke="var(--c)" stroke-width="2"/><text x="361" y="256" text-anchor="middle" class="l" style="font-weight:700">Your AI IDE model</text><text x="361" y="278" text-anchor="middle" class="s m">reasons, verifies, writes</text><rect x="750" y="130" width="126" height="82" rx="12" fill="none" stroke="var(--ok)" stroke-width="2"/><text x="813" y="160" text-anchor="middle" class="l" style="font-weight:700">Report</text><text x="813" y="182" text-anchor="middle" class="s m">HTML + Markdown</text><line x1="184" y1="137" x2="236" y2="137" stroke="var(--mute)" stroke-width="2" marker-end="url(#ah)"/><line x1="486" y1="137" x2="540" y2="137" stroke="var(--mute)" stroke-width="2" marker-end="url(#ah)"/><line x1="710" y1="137" x2="750" y2="160" stroke="var(--mute)" stroke-width="2" marker-end="url(#ah)"/><line x1="625" y1="194" x2="625" y2="226" stroke="var(--mute)" stroke-width="2" marker-end="url(#ah)"/><line x1="540" y1="267" x2="486" y2="267" stroke="var(--mute)" stroke-width="2" marker-end="url(#ah)"/><line x1="361" y1="226" x2="361" y2="194" stroke="var(--mute)" stroke-width="2" marker-end="url(#ah)"/><text x="298" y="214" class="s m" text-anchor="start" transform="translate(70,0)">checks every finding</text><text x="548" y="214" class="s m">method</text><g class="s m"><text x="24" y="226">CLI never calls a model</text><text x="24" y="246">No API key. No telemetry.</text><text x="24" y="266">Secrets redacted before output.</text></g>
</svg>
