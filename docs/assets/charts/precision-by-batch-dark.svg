xt-anchor="middle" class="n">52%</text><text x="620" y="364" text-anchor="middle" class="l">Unseen batch 2</text><text x="620" y="382" text-anchor="middle" class="s m">n = 21 labeled</text><rect x="70" y="398" width="12" height="12" rx="3" fill="var(--a)"/><text x="88" y="408" class="s">Precision: the code really is what the rule says</text><rect x="400" y="398" width="12" height="12" rx="3" fill="var(--b)"/><text x="418" y="408" class="s">Actionable: a maintainer would act</text>
