<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">Precision and actionable rate by evaluation batch</title><desc id="d">Precision was 50% at baseline, 69% on the first unseen batch and 95% on the second. The actionable rate was 29%, 34% and 52%.</desc>
<style>
:root{--bg:#121a33;--ink:#e6eaf5;--mute:#aab4cc;--line:#2c3a60;--a:#a5b4fc;--b:#5eead4;--c:#f0c36a;--bad:#ff9b92;--ok:#5fd39a}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.t{font-size:18px;font-weight:700}.s{font-size:12px}.l{font-size:13px}.n{font-size:13px;font-weight:700}
.axis{stroke:var(--line);stroke-width:1}.grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
</style>
<rect width="760" height="420" rx="14" fill="var(--bg)" stroke="var(--line)"/>
<text x="70" y="34" class="t">Share of findings that were real, by evaluation batch</text>
