<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
<title id="t">Scan time and memory by repository size</title><desc id="d">Synthetic benchmark: small: 0.7 seconds, 57 MB; medium: 1.8 seconds, 94 MB; at default limit: 15.2 seconds, 233 MB; over limit (20k files, truncated): 8.7 seconds, 234 MB.</desc>
<style>
:root{--bg:#ffffff;--ink:#15181e;--mute:#565e6e;--line:#d9dde7;--a:#4338ca;--b:#0f766e;--c:#b45309;--bad:#b42318;--ok:#17794a}
@media (prefers-color-scheme: dark){:root{--bg:#131820;--ink:#e8ebf2;--mute:#a2abbb;--line:#2b3442;--a:#a5a8ff;--b:#5eead4;--c:#f0c36a;--bad:#ff8a80;--ok:#5fd39a}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.t{font-size:18px;font-weight:700}.s{font-size:12px}.l{font-size:13px}.n{font-size:13px;font-weight:700}
.axis{stroke:var(--line);stroke-width:1}.grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
</style>
<rect width="760" height="380" rx="14" fill="var(--bg)" stroke="var(--line)"/>
<text x="24" y="34" class="t">How long a scan takes (synthetic repositories, one laptop)</text><text x="24" y="54" class="s m">Time in seconds with peak memory. Capped at 5 000 files: bigger repositories are cut off and the report says so.</text><line x1="70" x2="730" y1="290" y2="290" class="axis"/><text x="62" y="294" text-anchor="end" class="s m">0s</text><line x1="70" x2="730" y1="240" y2="240" class="grid"/><text x="62" y="244" text-anchor="end" class="s m">4s</text><line x1="70" x2="730" y1="190" y2="190" class="grid"/><text x="62" y="194" text-anchor="end" class="s m">9s</text><line x1="70" x2="730" y1="140" y2="140" class="grid"/><text x="62" y="144" text-anchor="end" class="s m">13s</text><line x1="70" x2="730" y1="90" y2="90" class="grid"/><text x="62" y="94" text-anchor="end" class="s m">17s</text><rect x="106.3" y="282.28274466361523" width="92.4" height="7.717255336384741" rx="5" fill="var(--a)"/><text x="152.5" y="274.28274466361523" text-anchor="middle" class="n">0.7s</text><text x="152.5" y="312" text-anchor="middle" class="s">small</text><text x="152.5" y="330" text-anchor="middle" class="s m">201 files, 57 MB</text><rect x="271.3" y="269.75651715915694" width="92.4" height="20.24348284084306" rx="5" fill="var(--a)"/><text x="317.5" y="261.75651715915694" text-anchor="middle" class="n">1.8s</text><text x="317.5" y="312" text-anchor="middle" class="s">medium</text><text x="317.5" y="330" text-anchor="middle" class="s m">1001 files, 94 MB</text><rect x="436.3" y="116.08695652173913" width="92.4" height="173.91304347826087" rx="5" fill="var(--c)"/><text x="482.5" y="108.08695652173913" text-anchor="middle" class="n">15.2s</text><text x="482.5" y="312" text-anchor="middle" class="s">at default limit</text><text x="482.5" y="330" text-anchor="middle" class="s m">5000 files, 233 MB, truncated</text><rect x="601.3" y="190.7061746630141" width="92.4" height="99.29382533698588" rx="5" fill="var(--c)"/><text x="647.5" y="182.7061746630141" text-anchor="middle" class="n">8.7s</text><text x="647.5" y="312" text-anchor="middle" class="s">over limit</text><text x="647.5" y="330" text-anchor="middle" class="s m">5000 files, 234 MB, truncated</text>
</svg>
