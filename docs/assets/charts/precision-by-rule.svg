<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="t d">
<title id="t">Baseline precision by audit rule</title><desc id="d">Per-rule precision at baseline: AS-ARC-001 0% (n=5), AS-SEC-001 18% (n=11), AS-ARC-003 50% (n=8), AS-IAC-001 50% (n=2), AS-SEC-004 50% (n=8), AS-SEC-005 86% (n=7), AS-OPS-003 100% (n=4), AS-SEC-002 100% (n=3).</desc>
<style>
:root{--bg:#ffffff;--ink:#0f172a;--mute:#475569;--line:#d9dfea;--a:#4f46e5;--b:#0f766e;--c:#b45309;--bad:#b91c1c;--ok:#15803d}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.t{font-size:18px;font-weight:700}.s{font-size:12px}.l{font-size:13px}.n{font-size:13px;font-weight:700}
.axis{stroke:var(--line);stroke-width:1}.grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
</style>
<rect width="760" height="390" rx="14" fill="var(--bg)" stroke="var(--line)"/>
<text x="24" y="34" class="t">Where the first version was noisy: precision by rule (v0.1.0 baseline)</text>
<text x="24" y="54" class="s m">Each bar is the share of that rule's sampled findings that were real. Labeled count at the right. These are the rules the fixes targeted.</text><text x="140" y="97" text-anchor="end" class="l">AS-ARC-001</text><rect x="150" y="82" width="530" height="20" rx="4" fill="var(--line)" opacity=".5"/><rect x="150" y="82" width="2" height="20" rx="4" fill="var(--bad)"/><text x="158" y="97" class="n">0%</text><text x="736" y="97" text-anchor="end" class="s m">n=5</text><text x="140" y="131" text-anchor="end" class="l">AS-SEC-001</text><rect x="150" y="116" width="530" height="20" rx="4" fill="var(--line)" opacity=".5"/><rect x="150" y="116" width="96.36363636363636" height="20" rx="4" fill="var(--bad)"/><text x="254.36363636363637" y="131" class="n">18%</text><text x="736" y="131" text-anchor="end" class="s m">n=11</text><text x="140" y="165" text-anchor="end" class="l">AS-ARC-003</text><rect x="150" y="150" width="530" height="20" rx="4" fill="var(--line)" opacity=".5"/><rect x="150" y="150" width="265" height="20" rx="4" fill="var(--c)"/><text x="423" y="165" class="n">50%</text><text x="736" y="165" text-anchor="end" class="s m">n=8</text><text x="140" y="199" text-anchor="end" class="l">AS-IAC-001</text><rect x="150" y="184" width="530" height="20" rx="4" fill="var(--line)" opacity=".5"/><rect x="150" y="184" width="265" height="20" rx="4" fill="var(--c)"/><text x="423" y="199" class="n">50%</text><text x="736" y="199" text-anchor="end" class="s m">n=2</text><text x="140" y="233" text-anchor="end" class="l">AS-SEC-004</text><rect x="150" y="218" width="530" height="20" rx="4" fill="var(--line)" opacity=".5"/><rect x="150" y="218" width="265" height="20" rx="4" fill="var(--c)"/><text x="423" y="233" class="n">50%</text><text x="736" y="233" text-anchor="end" class="s m">n=8</text><text x="140" y="267" text-anchor="end" class="l">AS-SEC-005</text><rect x="150" y="252" width="530" height="20" rx="4" fill="var(--line)" opacity=".5"/><rect x="150" y="252" width="454.2857142857143" height="20" rx="4" fill="var(--ok)"/><text x="612.2857142857142" y="267" class="n">86%</text><text x="736" y="267" text-anchor="end" class="s m">n=7</text><text x="140" y="301" text-anchor="end" class="l">AS-OPS-003</text><rect x="150" y="286" width="530" height="20" rx="4" fill="var(--line)" opacity=".5"/><rect x="150" y="286" width="530" height="20" rx="4" fill="var(--ok)"/><text x="688" y="301" class="n">100%</text><text x="736" y="301" text-anchor="end" class="s m">n=4</text><text x="140" y="335" text-anchor="end" class="l">AS-SEC-002</text><rect x="150" y="320" width="530" height="20" rx="4" fill="var(--line)" opacity=".5"/><rect x="150" y="320" width="530" height="20" rx="4" fill="var(--ok)"/><text x="688" y="335" class="n">100%</text><text x="736" y="335" text-anchor="end" class="s m">n=3</text>
</svg>
