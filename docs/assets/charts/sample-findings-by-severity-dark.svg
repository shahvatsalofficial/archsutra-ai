<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">Findings by severity in the sample audit</title><desc id="d">Counts: critical 0, high 3, medium 7, low 2, info 0.</desc>
<style>
:root{--bg:#121a33;--ink:#e6eaf5;--mute:#aab4cc;--line:#2c3a60;--a:#a5b4fc;--b:#5eead4;--c:#f0c36a;--bad:#ff9b92;--ok:#5fd39a}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.t{font-size:18px;font-weight:700}.s{font-size:12px}.l{font-size:13px}.n{font-size:13px;font-weight:700}
.axis{stroke:var(--line);stroke-width:1}.grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
</style>
<rect width="760" height="330" rx="14" fill="var(--bg)" stroke="var(--line)"/>
<text x="24" y="34" class="t">What one audit of the sample monolith found</text><text x="24" y="54" class="s m">12 findings from the real output in examples/brownfield-monolith (severity, not importance order).</text><text x="108" y="104" text-anchor="end" class="l">critical</text><rect x="120" y="86" width="4" height="26" rx="5" fill="var(--bad)" opacity="0.25"/><text x="134" y="105" class="n">0</text><text x="108" y="148" text-anchor="end" class="l">high</text><rect x="120" y="130" width="227.14285714285714" height="26" rx="5" fill="var(--bad)" opacity="1"/><text x="357.1428571428571" y="149" class="n">3</text><text x="108" y="192" text-anchor="end" class="l">medium</text><rect x="120" y="174" width="530" height="26" rx="5" fill="var(--c)" opacity="1"/><text x="660" y="193" class="n">7</text><text x="108" y="236" text-anchor="end" class="l">low</text><rect x="120" y="218" width="151.42857142857142" height="26" rx="5" fill="var(--a)" opacity="1"/><text x="281.42857142857144" y="237" class="n">2</text><text x="108" y="280" text-anchor="end" class="l">info</text><rect x="120" y="262" width="4" height="26" rx="5" fill="var(--mute)" opacity="0.25"/><text x="134" y="281" class="n">0</text>
</svg>
