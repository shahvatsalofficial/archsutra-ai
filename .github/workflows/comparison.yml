name: Tool comparison (manual)

# Runs ArchSutra and Semgrep (pinned) on the same pinned set of public repositories and publishes an overlap report.
# Manual only: it clones third-party repositories and downloads Semgrep. Nothing from those repositories is executed.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Repository batch from scripts/realworld-repos.json"
        default: "holdout2"
        required: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Semgrep (pinned)
        run: python3 -m pip install --user "semgrep==1.183.0"
      - name: Run both tools and compare
        env:
          BATCH: ${{ inputs.batch }}
          SEMGREP_SEND_METRICS: "off"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          node scripts/compare.mjs "$RUNNER_TEMP/compare" "$BATCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison
          path: |
            docs/proof/comparison/*.json
            docs/proof/comparison/*.md
