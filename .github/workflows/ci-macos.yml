name: CI macOS

# Separate from the main CI on purpose. GitHub's macOS runners are often unavailable: jobs have waited 30 to 45 minutes
# without a runner and GitHub then cancelled them (no steps ran). That is an infrastructure outcome, not a test failure,
# so it must not turn the main CI red. A pass here is real evidence; a cancelled run with no steps is not.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify
      - run: node dist/cli.js audit . --fail-on high
