name: Release

# Runs when a version tag is pushed. Builds, tests, packs the tarball, creates an SBOM and checksums,
# attests build provenance (SLSA-style, signed with GitHub's Sigstore integration) and attaches everything to the GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and upload assets
      id-token: write       # keyless signing for the attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify
      - name: Pack tarball
        run: |
          mkdir -p release
          npm pack --pack-destination release
      - name: SBOM (CycloneDX, production and full)
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > release/sbom-production.cdx.json
          npm sbom --sbom-format cyclonedx > release/sbom-full.cdx.json
      - name: Checksums
        working-directory: release
        run: sha256sum *.tgz *.json > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "ArchSutra AI $TAG" --generate-notes
          gh release upload "$TAG" release/* --clobber
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
